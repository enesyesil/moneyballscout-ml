# Continuous deployment: every pull request is tested; every push to main is tested and, if green, deployed to
# Coolify, then health-checked. Run the Bootstrap workflow once before the first deploy.
name: Deploy

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  # PRs: newest commit wins. main: deploys queue up and never cancel each other mid-way.
  group: ${{ github.event_name == 'pull_request' && format('ci-{0}', github.ref) || 'production-deploy' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - run: "pip install --only-binary=:all: -r requirements-dev.txt"
      - name: Tests (synthetic league, no network)
        run: pytest -q -p no:warnings
      - name: OpenAPI spec is up to date
        run: |
          python -c "import json; from app.main import app; json.dump(app.openapi(), open('openapi.json','w'), indent=1)"
          git diff --exit-code openapi.json || { echo "::error::backend/openapi.json is stale - regenerate it (README > Run locally)"; exit 1; }

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: API types match the backend
        run: |
          npm run gen:api
          git diff --exit-code src/api/schema.d.ts || { echo "::error::frontend/src/api/schema.d.ts is stale - run npm run gen:api"; exit 1; }
      - run: npm run build

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: [backend, frontend]
    runs-on: ubuntu-latest
    environment:
      name: production
      url: ${{ vars.SITE_URL }}
    timeout-minutes: 45
    env:
      COOLIFY_URL: ${{ vars.COOLIFY_URL }}
      COOLIFY_APP_UUID: ${{ vars.COOLIFY_APP_UUID }}
      COOLIFY_TOKEN: ${{ secrets.COOLIFY_TOKEN }}
      SITE_URL: ${{ vars.SITE_URL }}
    steps:
      - uses: actions/checkout@v4
      - name: Check settings
        id: cfg
        run: |
          if [ -z "$COOLIFY_URL" ] || [ -z "$COOLIFY_APP_UUID" ] || [ -z "$COOLIFY_TOKEN" ] || [ -z "$SITE_URL" ]; then
            echo "::warning::Coolify is not configured in the 'production' environment yet - skipping deploy (see README > Deploy)"
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Deploy
        if: steps.cfg.outputs.ready == 'true'
        run: python3 deploy/coolify.py deploy --expect-commit "$GITHUB_SHA"
      - name: Health check
        if: steps.cfg.outputs.ready == 'true'
        run: python3 deploy/coolify.py wait-healthy --site "$SITE_URL" --expect-commit "$GITHUB_SHA" --timeout 300
      - name: Smoke test
        if: steps.cfg.outputs.ready == 'true'
        run: |
          for path in / /api/meta /api/dashboard /api/models/runs; do
            code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 20 "${SITE_URL%/}$path")
            echo "$path -> $code"
            [ "$code" = "200" ] || { echo "::error::$path returned $code"; exit 1; }
          done
