# Local development: Postgres + MinIO + MLflow in Docker; run the API, worker and Vite on the host
# (see README), or `docker compose -f docker-compose.prod.yml up --build` for the full stack.
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: scout
      POSTGRES_PASSWORD: scout
      POSTGRES_DB: scout
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U scout -d scout"]
      interval: 5s
      retries: 10

  minio:
    image: minio/minio:RELEASE.2024-12-18T13-15-44Z
    command: server /data --console-address :9001
    environment:
      MINIO_ROOT_USER: scout
      MINIO_ROOT_PASSWORD: scout-dev-secret
    ports: ["9000:9000", "9001:9001"]
    volumes: [miniodata:/data]

  mlflow:
    build: ./deploy/mlflow
    environment:
      PGHOST: db
      PGUSER: scout
      PGPASSWORD: scout
      MLFLOW_S3_ENDPOINT_URL: http://minio:9000
      AWS_ACCESS_KEY_ID: scout
      AWS_SECRET_ACCESS_KEY: scout-dev-secret
    ports: ["5001:5000"]
    depends_on:
      db: {condition: service_healthy}
      minio: {condition: service_started}

volumes:
  pgdata:
  miniodata:
