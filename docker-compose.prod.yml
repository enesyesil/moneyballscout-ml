# Production stack for Coolify (Docker Compose resource). Set the domain on `web` (port 80) and,
# optionally, on `mlflow` (port 5000, put it behind basic auth). Secrets come from Coolify env vars.
x-backend-env: &backend-env
  DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-scout}:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-scout}
  API_FOOTBALL_KEY: ${API_FOOTBALL_KEY:?set API_FOOTBALL_KEY}
  LEAGUES: ${LEAGUES:-39}
  SEASON: ${SEASON:-2025}
  DAILY_QUOTA: ${DAILY_QUOTA:-100}
  PER_MINUTE_LIMIT: ${PER_MINUTE_LIMIT:-10}
  STORAGE_BACKEND: s3
  S3_ENDPOINT: http://minio:9000
  S3_ACCESS_KEY: ${MINIO_ROOT_USER:-scout}
  S3_SECRET_KEY: ${MINIO_ROOT_PASSWORD:?set MINIO_ROOT_PASSWORD}
  S3_BUCKET: ${S3_BUCKET:-scout}
  MLFLOW_TRACKING_URI: http://mlflow:5000
  SYNC_CRON_HOUR: ${SYNC_CRON_HOUR:-4}
  CORS_ORIGINS: ${CORS_ORIGINS:-}
  GIT_SHA: ${SOURCE_COMMIT:-}

services:
  web:
    build: ./frontend
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    expose: ["80"]

  api:
    build:
      context: ./backend
      args:
        GIT_SHA: ${SOURCE_COMMIT:-}
    restart: unless-stopped
    environment: *backend-env
    depends_on:
      db:
        condition: service_healthy
      minio:
        condition: service_started
    expose: ["8000"]

  worker:
    build:
      context: ./backend
      args:
        GIT_SHA: ${SOURCE_COMMIT:-}
    restart: unless-stopped
    command: ["sh", "-c", "alembic upgrade head && python -m app.worker"]
    environment:
      <<: *backend-env
      RUN_ON_START: ${RUN_ON_START:-1}
    depends_on:
      db:
        condition: service_healthy
      minio:
        condition: service_started
      mlflow:
        condition: service_started
    healthcheck:
      disable: true

  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-scout}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-scout}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio:RELEASE.2024-12-18T13-15-44Z
    restart: unless-stopped
    command: server /data --console-address :9001
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-scout}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?set MINIO_ROOT_PASSWORD}
    volumes:
      - miniodata:/data
    expose: ["9000", "9001"]

  mlflow:
    build: ./deploy/mlflow
    restart: unless-stopped
    environment:
      PGHOST: db
      PGUSER: ${POSTGRES_USER:-scout}
      PGPASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      MLFLOW_S3_ENDPOINT_URL: http://minio:9000
      AWS_ACCESS_KEY_ID: ${MINIO_ROOT_USER:-scout}
      AWS_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD:?set MINIO_ROOT_PASSWORD}
      S3_BUCKET: ${S3_BUCKET:-scout}
    depends_on:
      db:
        condition: service_healthy
      minio:
        condition: service_started
    expose: ["5000"]

volumes:
  pgdata:
  miniodata:
